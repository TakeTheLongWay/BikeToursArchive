<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>MyBikeLog – Tourplanung</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('pages.vendor_static', filename='leaflet/leaflet.css') }}">
    <script defer src="{{ url_for('pages.vendor_static', filename='leaflet/leaflet.js') }}"></script>

    <style>
        /* ── Werkzeugleiste: Buttongruppen (.toolGroup) durch Trennlinien abgesetzt ── */
        #planningToolbar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            margin-bottom: 6px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .toolGroup {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .toolGroup + .toolGroup {
            border-left: 1px solid #dde3ee;
            padding-left: 6px;
        }

        .toolButton {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            padding: 0 8px;
            border-radius: 6px;
            background: transparent;
            color: #1C3F75;
            font-size: 13px;
            font-weight: 600;
        }

        .toolButton:hover {
            background-color: #e8eef8;
        }

        .toolButton.danger:hover {
            background-color: #fbeaea;
            color: #c0392b;
        }

        .toolButton:disabled {
            color: #a8b3c6;
            background: transparent;
            cursor: default;
        }

        .toolSelect {
            height: 28px;
            padding: 0 6px;
            border: 1px solid #dde3ee;
            border-radius: 6px;
            background: #fff;
            color: #1C3F75;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .toolSelect:disabled {
            color: #a8b3c6;
            cursor: default;
        }

        .toolButton svg {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
        }

        /* ── Auswahlliste von "Öffnen" ── */
        #planOpenPanel {
            position: absolute;
            top: calc(100% + 4px);
            left: 6px;
            z-index: 1100;
            width: 340px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 4px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        #planOpenPanel[hidden] {
            display: none;
        }

        .planOpenItem {
            display: block;
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            background: transparent;
            color: #333;
            text-align: left;
            font-weight: normal;
        }

        .planOpenItem:hover {
            background-color: #e8eef8;
        }

        .planOpenItem.current {
            background-color: #f0f4fb;
        }

        .planOpenName {
            font-size: 13px;
            font-weight: 600;
            color: #1C3F75;
        }

        .planOpenMeta {
            font-size: 11px;
            color: #666;
        }

        .planOpenMeta.dirty {
            color: #b9770e;
        }

        .planOpenEmpty {
            padding: 8px;
            font-size: 12px;
            color: #666;
        }

        #planStatus {
            margin-left: auto;
            padding-right: 4px;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #planStatus.dirty {
            color: #b9770e;
        }

        /* ── Namensdialog beim ersten Speichern ── */
        #planNameDialog {
            width: 340px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        #planNameDialog::backdrop {
            background: rgba(0,0,0,0.25);
        }

        #planNameDialog label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #1C3F75;
        }

        #planNameInput {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
            border: 1px solid #dde3ee;
            border-radius: 6px;
            font-size: 14px;
        }

        .dialogButtons {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 12px;
        }

        .dialogButtons button {
            padding: 6px 14px;
            font-size: 13px;
        }

        .dialogButtons .cancel {
            background-color: #e8eef8;
            color: #1C3F75;
        }

        /* Fadenkreuz, solange Trackpunkte gesetzt werden können */
        #planningMap.drawing.leaflet-grab {
            cursor: crosshair;
        }

        /* Klick auf den Track fügt einen Trackpunkt ein, Trackpunkte lassen sich verschieben */
        #planningMap.drawing path.trackHitLine {
            cursor: copy;
        }

        #planningMap.drawing path.trackPoint,
        #planningMap.movingPoint,
        #planningMap.movingPoint path {
            cursor: move;
        }

        #planningMap {
            height: calc(100vh - 84px);
            min-height: 400px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div id="MainMenuDashboard">
    <button id="btnDashboard" onclick="window.location.href='{{ url_for('pages.index') }}'">Dashboard</button>
    <button id="btnDiary" onclick="window.location.href='{{ url_for('pages.diary') }}'">Tagebuch</button>
    <button id="btnBikeTracker" onclick="window.location.href='{{ url_for('biketracker.biketracker') }}'">BikeTracker</button>
    <button id="btnEditGoals" onclick="window.location.href='{{ url_for('pages.mygoals') }}'">Ziele</button>
    <button id="btnMyBikes" onclick="window.location.href='{{ url_for('pages.mybikes') }}'">Bikes</button>
    <button id="btnSettings" onclick="window.location.href='{{ url_for('pages.appsettings') }}'">Settings</button>
    <button id="btnStatistics" onclick="window.location.href='{{ url_for('pages.statistics') }}'">Statistik</button>
    <button id="btnGallery" onclick="window.location.href='{{ url_for('pages.gallery') }}'">Galerie</button>
    <button id="btnPlanning" onclick="window.location.href='{{ url_for('pages.tour_planning') }}'">Planen</button>
</div>

<div id="pageContent">

    <div id="planningToolbar">
        <div class="toolGroup" id="toolGroupFile">
            <button class="toolButton" id="btnPlanNew" title="Neue Planung beginnen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                    <path d="M14 3v6h6"/><path d="M12 12v6"/><path d="M9 15h6"/>
                </svg>
                Neu
            </button>
            <button class="toolButton" id="btnPlanOpen" title="Ältere Planung öffnen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/>
                    <path d="M3 7v11a2 2 0 0 0 2 2h13l3-8H7l-3 8"/>
                </svg>
                Öffnen
            </button>
            <button class="toolButton" id="btnPlanSave" title="Planung speichern" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>
                </svg>
                Speichern
            </button>
            <button class="toolButton" id="btnPlanExport" title="Track als GPX-Datei herunterladen" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/>
                    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
                </svg>
                Export
            </button>
        </div>
        <div class="toolGroup" id="toolGroupEdit">
            <button class="toolButton" id="btnTrackUndo" title="Letzten Trackpunkt entfernen (Strg+Z)" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 14L4 9l5-5"/>
                    <path d="M4 9h11a5 5 0 0 1 0 10h-3"/>
                </svg>
                Rückgängig
            </button>
        </div>
        <div class="toolGroup" id="toolGroupActivity">
            <select class="toolSelect" id="selPlanActivity" title="Aktivität, für die der Track geroutet wird" disabled>
                {% for key, label in activities.items() %}
                <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="toolGroup" id="toolGroupDelete">
            <button class="toolButton danger" id="btnPlanDelete" title="Aktuelle Planung löschen" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/><path d="M8 6V4h8v2"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6"/><path d="M14 11v6"/>
                </svg>
                Löschen
            </button>
        </div>
        <div id="planStatus"></div>
        <div id="planOpenPanel" hidden></div>
    </div>

    <div id="planningMap"></div>

    <dialog id="planNameDialog">
        <form method="dialog">
            <label for="planNameInput">Name des Tracks</label>
            <input id="planNameInput" maxlength="255" required pattern=".*\S.*" autocomplete="off">
            <div class="dialogButtons">
                <button type="button" class="cancel" id="btnPlanNameCancel">Abbrechen</button>
                <button type="submit" value="ok">Speichern</button>
            </div>
        </form>
    </dialog>

</div>

<script>
    window.onload = async function() {
        const homebase = {{ homebase|tojson }};
        const DRAFT_SAVE_DELAY_MS = 800;
        const TRACK_COLOR = "#1C3F75";
        const UNROUTED_COLOR = "#c0392b";
        // Breite der unsichtbaren Klickfläche über dem Track in Pixeln
        const TRACK_HIT_WEIGHT = 14;
        // Mindestbewegung in Pixeln, ab der ein gedrückter Trackpunkt verschoben statt angeklickt wird
        const DRAG_THRESHOLD_PX = 3;
        // Maximale Länge (einfache Strecke) eines Hin-und-zurück-Auswuchses am verschobenen Trackpunkt,
        // der abgeschnitten wird; entsteht meist, wenn der Punkt neben dem Weg abgelegt wurde
        const SPUR_MAX_M = 100;
        // Sperrzone gegen das Umkehren am verschobenen Trackpunkt: Abstand zum Punkt und Radius in Metern
        const UTURN_BLOCK_DISTANCE_M = 15;
        const UTURN_BLOCK_RADIUS_M = 10;

        const btnNew = document.getElementById("btnPlanNew");
        const btnOpen = document.getElementById("btnPlanOpen");
        const openPanel = document.getElementById("planOpenPanel");
        const btnSave = document.getElementById("btnPlanSave");
        const btnDelete = document.getElementById("btnPlanDelete");
        const selActivity = document.getElementById("selPlanActivity");
        const btnUndo = document.getElementById("btnTrackUndo");
        const btnExport = document.getElementById("btnPlanExport");
        const nameDialog = document.getElementById("planNameDialog");
        const nameInput = document.getElementById("planNameInput");
        // Voreinstellung ist die erste Aktivität der Auswahl (Fahrrad)
        const DEFAULT_ACTIVITY = selActivity.options[0].value;
        const statusEl = document.getElementById("planStatus");

        // Aktuelle Planungssession; null = noch keine angelegt
        let plan = null;
        let draftTimer = null;
        // Track der Session: activity = Aktivität, für die geroutet wird,
        // points = gesetzte Trackpunkte [lat, lon], segments[i] = Verbindung von points[i] nach points[i + 1]
        let track = { activity: DEFAULT_ACTIVITY, points: [], segments: [] };
        // Wird bei jedem Sessionwechsel erhöht; verwirft Routing-Antworten der vorherigen Session
        let trackGeneration = 0;
        // Klicks nacheinander abarbeiten, damit jedes Segment am vorherigen Punkt ansetzt
        let routingChain = Promise.resolve();
        // Stand des Tracks vor jeder Änderung (Setzen, Einfügen, Verschieben), für "Rückgängig"
        let trackHistory = [];
        // Angezeigte Linie je Segment, um sie beim Verschieben eines Trackpunkts abzublenden
        let segmentLines = [];
        // Gesetzt nach dem Ablegen eines verschobenen Trackpunkts: der folgende Klick setzt keinen Punkt
        let pointDragged = false;

        const map = L.map("planningMap");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);
        const trackLayer = L.layerGroup().addTo(map);

        function homebaseView() {
            return { lat: homebase.lat, lon: homebase.lon, zoom: homebase.zoom };
        }

        // Arbeitsstand der Session: Kartenausschnitt und Track
        function currentDraft() {
            const center = map.getCenter();
            return {
                map: {
                    lat: Math.round(center.lat * 1e6) / 1e6,
                    lon: Math.round(center.lng * 1e6) / 1e6,
                    zoom: map.getZoom()
                },
                track: track
            };
        }

        function trackDistanceKm() {
            return track.segments.reduce((sum, seg) => sum + (seg.distance_m || 0), 0) / 1000;
        }

        function renderTrack() {
            trackLayer.clearLayers();
            segmentLines = track.segments.map(seg => {
                const latlngs = seg.coords.map(c => [c[0], c[1]]);
                const line = L.polyline(latlngs, {
                    color: seg.routed ? TRACK_COLOR : UNROUTED_COLOR,
                    weight: 4,
                    opacity: 0.85,
                    dashArray: seg.routed ? null : "6 6",
                    interactive: false
                }).addTo(trackLayer);
                if (plan) {
                    // Breite, unsichtbare Linie darüber: ein Klick auf den Track fügt dort einen Trackpunkt ein
                    L.polyline(latlngs, { weight: TRACK_HIT_WEIGHT, opacity: 0, className: "trackHitLine" })
                        .on("click", event => onTrackClick(event, seg))
                        .addTo(trackLayer);
                }
                return line;
            });
            // Ein Klick ohne Verschieben geht durch den Marker an die Karte und setzt dort einen Punkt
            track.points.forEach((pt, i) => {
                const isStart = i === 0;
                const marker = L.circleMarker(pt, {
                    radius: isStart ? 7 : 5,
                    color: isStart ? "#1e8449" : TRACK_COLOR,
                    weight: 2,
                    fillColor: isStart ? "#27ae60" : "#fff",
                    fillOpacity: 1,
                    interactive: !!plan,
                    className: "trackPoint"
                }).addTo(trackLayer);
                if (plan) {
                    marker.on("mousedown", event => startPointDrag(event, pt, marker));
                    // Rechtsklick löscht den Trackpunkt
                    marker.on("contextmenu", event => onPointContextMenu(event, pt));
                }
            });
        }

        // Track der (neu) geladenen Session übernehmen und anzeigen
        function loadTrack() {
            trackGeneration++;
            routingChain = Promise.resolve();
            trackHistory = [];
            const saved = plan && plan.draft && plan.draft.track;
            const activityKnown = saved && [...selActivity.options].some(o => o.value === saved.activity);
            track = {
                activity: activityKnown ? saved.activity : DEFAULT_ACTIVITY,
                points: (saved && Array.isArray(saved.points)) ? saved.points : [],
                segments: (saved && Array.isArray(saved.segments)) ? saved.segments : []
            };
            selActivity.value = track.activity;
            renderTrack();
            map.getContainer().classList.toggle("drawing", !!plan);
        }

        function updateStatus(message) {
            btnSave.disabled = !plan;
            btnDelete.disabled = !plan;
            selActivity.disabled = !plan;
            btnUndo.disabled = !plan || !track.points.length;
            btnExport.disabled = !plan || !track.points.length;
            statusEl.classList.toggle("dirty", !!(plan && plan.dirty));
            if (message) {
                statusEl.textContent = message;
            } else if (!plan) {
                statusEl.textContent = "Keine Planung – mit „Neu“ beginnen";
            } else {
                const distance = track.segments.length
                    ? " · " + trackDistanceKm().toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " km"
                    : (track.points.length ? "" : " · Startpunkt per Klick in die Karte setzen");
                statusEl.textContent = plan.name + distance + " · " + (plan.dirty ? "ungespeicherte Änderungen" : "gespeichert");
            }
        }

        async function api(url, method, body) {
            const response = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined
            });
            const data = await response.json();
            if (!response.ok || data.status !== "ok") {
                throw new Error(data.message || data.error || ("HTTP " + response.status));
            }
            return data.plan;
        }

        async function saveDraftNow() {
            clearTimeout(draftTimer);
            draftTimer = null;
            if (!plan) return;
            try {
                plan = await api("/api/tour-plans/" + plan.id + "/draft", "PUT", { draft: currentDraft() });
                updateStatus();
            } catch (e) {
                console.error("Fehler beim Sichern des Arbeitsstands:", e);
                updateStatus("Arbeitsstand konnte nicht gesichert werden");
            }
        }

        function scheduleDraftSave() {
            if (!plan) return;
            clearTimeout(draftTimer);
            draftTimer = setTimeout(saveDraftNow, DRAFT_SAVE_DELAY_MS);
        }

        // avoid: optionale Sperrzonen [[lat, lon, radius_m], ...], die die Route nicht berühren darf
        async function routeSegment(from, to, activity, avoid) {
            const response = await fetch("/api/routing/segment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ from: from, to: to, activity: activity, avoid: avoid })
            });
            const data = await response.json();
            if (!response.ok || data.status !== "ok") {
                throw new Error(data.message || data.error || ("HTTP " + response.status));
            }
            return Object.assign({ routed: true }, data.segment);
        }

        function roundPoint(latlng) {
            return [Math.round(latlng.lat * 1e6) / 1e6, Math.round(latlng.lng * 1e6) / 1e6];
        }

        // Liefert { segment, warning }; ohne Route wird als gestrichelte Luftlinie verbunden,
        // damit der Punkt nicht verloren geht
        async function connectPoints(from, to) {
            try {
                return { segment: await routeSegment(from, to, track.activity), warning: null };
            } catch (e) {
                console.error("Fehler beim Routing:", e);
                return { segment: straightSegment(from, to), warning: "Keine Route gefunden – Luftlinie gesetzt" };
            }
        }

        function straightSegment(from, to) {
            return {
                coords: [from, to],
                distance_m: Math.round(map.distance(from, to)),
                activity: track.activity,
                routed: false
            };
        }

        function polylineLength(coords) {
            let length = 0;
            for (let j = 1; j < coords.length; j++) length += map.distance(coords[j - 1], coords[j]);
            return length;
        }

        function sameCoord(p, q) {
            return p[0] === q[0] && p[1] === q[1];
        }

        // Segment mit gekürztem Verlauf; Distanz und Anstieg anteilig nach Länge
        function trimSegment(segment, coords) {
            const ratio = polylineLength(coords) / (polylineLength(segment.coords) || 1);
            const part = value => value === undefined ? undefined : Math.round(value * ratio);
            return Object.assign({}, segment, {
                coords: coords,
                distance_m: part(segment.distance_m),
                ascent_m: part(segment.ascent_m)
            });
        }

        // Anzahl der Punkte, die das Ende von before rückwärts gelesen mit dem Anfang von after gemeinsam
        // hat: 1 = nur der Trackpunkt, ab 2 läuft die Route am Trackpunkt auf demselben Weg zurück.
        // In jedem Segment bleiben mindestens zwei Punkte des Verlaufs außerhalb.
        function sharedCoordCount(before, after) {
            const a = before.coords;
            const b = after.coords;
            if (!before.routed || !after.routed || !sameCoord(a[a.length - 1], b[0])) return 0;
            const maxShared = Math.min(a.length, b.length) - 1;
            let shared = 1;
            while (shared < maxShared && sameCoord(a[a.length - 1 - shared], b[shared])) shared++;
            return shared;
        }

        // Der verschobene Trackpunkt ist ein Zwischenziel, durch das der Track hindurchläuft. Kehrt die
        // Route dort auf dem Ankunftsweg um, wird der Weiterweg mit einer kleinen Sperrzone auf diesem
        // Weg neu geroutet. Gibt es keinen anderen Weiterweg (Sackgasse), bleibt das bisherige Segment.
        async function avoidUTurn(before, after, to) {
            const shared = sharedCoordCount(before, after);
            if (shared < 2) return after;
            const a = before.coords;
            const end = a[a.length - 1];
            // Sperrzone mit etwas Abstand zum Trackpunkt, damit der Start erreichbar bleibt
            let blocked = a[a.length - shared];
            for (let k = 1; k < shared; k++) {
                if (map.distance(end, a[a.length - 1 - k]) >= UTURN_BLOCK_DISTANCE_M) {
                    blocked = a[a.length - 1 - k];
                    break;
                }
            }
            const radius = Math.floor(Math.min(UTURN_BLOCK_RADIUS_M, map.distance(end, blocked) * 0.6));
            if (radius < 1) return after;
            try {
                return await routeSegment([end[0], end[1]], to, track.activity, [[blocked[0], blocked[1], radius]]);
            } catch (e) {
                console.info("Kein Weiterweg ohne Umkehr am Trackpunkt:", e);
                return after;
            }
        }

        // Verbindet die Segmente vor und nach einem verschobenen Trackpunkt zu einer durchgehenden Route.
        // Laufen das Ende von before und der Anfang von after denselben Weg hin und zurück, entstünde
        // eine Stichstrecke: ist sie höchstens SPUR_MAX_M lang, entfällt sie und der Trackpunkt liegt
        // dann an der Abzweigung.
        // Der Trackpunkt wird auf den Punkt gelegt, an dem die Route ihn erreicht.
        function joinAtTrackPoint(point, before, after) {
            const a = before && before.routed ? before.coords : null;
            const b = after && after.routed ? after.coords : null;
            const shared = before && after ? sharedCoordCount(before, after) : 0;
            // Längere Abstecher, etwa in eine Sackgasse, sind gewollt und bleiben erhalten
            if (shared > 1 && polylineLength(a.slice(a.length - shared)) <= SPUR_MAX_M) {
                before = trimSegment(before, a.slice(0, a.length - shared + 1));
                after = trimSegment(after, b.slice(shared - 1));
            }
            const onRoute = a ? before.coords[before.coords.length - 1] : (b ? after.coords[0] : point);
            point = [onRoute[0], onRoute[1]];
            // Luftlinien an den verlegten Trackpunkt anschließen
            if (before && !before.routed) before = straightSegment(before.coords[0], point);
            if (after && !after.routed) after = straightSegment(point, after.coords[after.coords.length - 1]);
            return { point: point, before: before, after: after };
        }

        // Teilt ein Segment an der Stelle des Verlaufs, die latlng am nächsten liegt. Der Verlauf
        // bleibt unverändert, deshalb ist kein erneutes Routing nötig. null, wenn nicht teilbar.
        function splitSegment(segment, latlng) {
            const coords = segment.coords;
            if (coords.length < 2) return null;
            const clicked = map.latLngToLayerPoint(latlng);
            let best = null;
            for (let j = 0; j < coords.length - 1; j++) {
                const a = map.latLngToLayerPoint([coords[j][0], coords[j][1]]);
                const b = map.latLngToLayerPoint([coords[j + 1][0], coords[j + 1][1]]);
                const onLine = L.LineUtil.closestPointOnSegment(clicked, a, b);
                const dist = clicked.distanceTo(onLine);
                if (!best || dist < best.dist) best = { dist: dist, index: j, layerPoint: onLine };
            }
            const point = roundPoint(map.layerPointToLatLng(best.layerPoint));
            const a = coords[best.index];
            const b = coords[best.index + 1];
            const coord = point.slice();
            // Höhe zwischen den beiden Nachbarpunkten des Verlaufs interpolieren
            if (a.length > 2 && b.length > 2) {
                const total = map.distance(a, b);
                const t = total ? map.distance(a, point) / total : 0;
                coord.push(Math.round((a[2] + (b[2] - a[2]) * t) * 10) / 10);
            }
            const beforeCoords = coords.slice(0, best.index + 1).concat([coord]);
            const afterCoords = [coord].concat(coords.slice(best.index + 1));

            // Distanz und Anstieg des Segments anteilig nach Länge aufteilen
            const lengthBefore = polylineLength(beforeCoords);
            const lengthAfter = polylineLength(afterCoords);
            const share = (lengthBefore + lengthAfter) ? lengthBefore / (lengthBefore + lengthAfter) : 0.5;
            const part = (value, ratio) => value === undefined ? undefined : Math.round(value * ratio);
            return {
                point: point,
                before: Object.assign({}, segment, {
                    coords: beforeCoords,
                    distance_m: part(segment.distance_m, share),
                    ascent_m: part(segment.ascent_m, share)
                }),
                after: Object.assign({}, segment, {
                    coords: afterCoords,
                    distance_m: part(segment.distance_m, 1 - share),
                    ascent_m: part(segment.ascent_m, 1 - share)
                })
            };
        }

        function insertTrackPoint(segment, latlng, generation) {
            if (generation !== trackGeneration) return;
            // Index erst jetzt bestimmen, vorherige Aktionen der Kette können ihn verschoben haben
            const index = track.segments.indexOf(segment);
            if (index < 0) return;
            const split = splitSegment(segment, latlng);
            if (!split) return;
            rememberTrack();
            track.segments.splice(index, 1, split.before, split.after);
            track.points.splice(index + 1, 0, split.point);
            renderTrack();
            updateStatus();
            scheduleDraftSave();
        }

        function onTrackClick(event, segment) {
            // Der Klick soll nicht zusätzlich am Trackende einen Punkt setzen
            L.DomEvent.stopPropagation(event);
            if (pointDragged) {
                pointDragged = false;
                return;
            }
            if (!openPanel.hidden || !plan) return;
            const generation = trackGeneration;
            routingChain = routingChain.then(() => insertTrackPoint(segment, event.latlng, generation));
        }

        // Verschiebt den Trackpunkt pointRef nach latlng und routet die angrenzenden Segmente neu
        async function moveTrackPoint(pointRef, latlng, generation) {
            if (generation !== trackGeneration) return;
            const index = track.points.indexOf(pointRef);
            if (index < 0) {
                renderTrack();
                return;
            }
            const point = roundPoint(latlng);
            const prev = index > 0 ? track.points[index - 1] : null;
            const next = index < track.points.length - 1 ? track.points[index + 1] : null;
            if (prev || next) updateStatus("Route wird berechnet …");
            const [before, after] = await Promise.all([
                prev ? connectPoints(prev, point) : null,
                next ? connectPoints(point, next) : null
            ]);
            // Session wurde während des Routings gewechselt
            if (generation !== trackGeneration) return;
            let afterSegment = after && after.segment;
            if (before && after) afterSegment = await avoidUTurn(before.segment, afterSegment, next);
            if (generation !== trackGeneration) return;
            const joined = joinAtTrackPoint(point, before && before.segment, afterSegment);
            rememberTrack();
            track.points[index] = joined.point;
            if (before) track.segments[index - 1] = joined.before;
            if (after) track.segments[index] = joined.after;
            renderTrack();
            updateStatus((before && before.warning) || (after && after.warning));
            scheduleDraftSave();
        }

        // Entfernt den Trackpunkt pointRef; seine Nachbarn werden direkt miteinander verbunden
        async function deleteTrackPoint(pointRef, generation) {
            if (generation !== trackGeneration) return;
            const index = track.points.indexOf(pointRef);
            if (index < 0) return;
            const last = track.points.length - 1;
            let warning = null;
            let bridge = null;
            if (index > 0 && index < last) {
                updateStatus("Route wird berechnet …");
                ({ segment: bridge, warning } = await connectPoints(track.points[index - 1], track.points[index + 1]));
                // Session wurde während des Routings gewechselt
                if (generation !== trackGeneration) return;
            }
            rememberTrack();
            track.points = track.points.filter((_, i) => i !== index);
            if (bridge) {
                track.segments = track.segments.slice(0, index - 1).concat([bridge], track.segments.slice(index + 1));
            } else if (track.segments.length) {
                // Start- oder Endpunkt: das anschließende Segment entfällt
                track.segments = index === 0 ? track.segments.slice(1) : track.segments.slice(0, -1);
            }
            renderTrack();
            updateStatus(warning);
            scheduleDraftSave();
        }

        function onPointContextMenu(event, pointRef) {
            L.DomEvent.stopPropagation(event);
            event.originalEvent.preventDefault();
            if (!plan) return;
            const generation = trackGeneration;
            routingChain = routingChain.then(() => deleteTrackPoint(pointRef, generation));
        }

        // Gedrückter Trackpunkt folgt der Maus; beim Loslassen wird er dort abgelegt
        function startPointDrag(event, pointRef, marker) {
            if (event.originalEvent.button !== 0) return;
            // Karte nicht mitschieben und keinen Text markieren
            map.dragging.disable();
            event.originalEvent.preventDefault();
            const container = map.getContainer();
            const startPos = map.mouseEventToContainerPoint(event.originalEvent);
            const index = track.points.indexOf(pointRef);
            const prev = index > 0 ? track.points[index - 1] : null;
            const next = index < track.points.length - 1 ? track.points[index + 1] : null;
            let preview = null;

            const onMove = (e) => {
                const pos = map.mouseEventToContainerPoint(e);
                if (!preview) {
                    if (pos.distanceTo(startPos) < DRAG_THRESHOLD_PX) return;
                    container.classList.add("movingPoint");
                    // Bisherige Verbindungen abblenden, bis die neue Route berechnet ist
                    [index - 1, index].forEach(s => segmentLines[s] && segmentLines[s].setStyle({ opacity: 0.25 }));
                    preview = L.polyline([], {
                        color: TRACK_COLOR,
                        weight: 3,
                        dashArray: "4 6",
                        interactive: false
                    }).addTo(trackLayer);
                }
                const latlng = map.containerPointToLatLng(pos);
                marker.setLatLng(latlng);
                preview.setLatLngs([prev, latlng, next].filter(Boolean));
            };

            const onUp = (e) => {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
                map.dragging.enable();
                container.classList.remove("movingPoint");
                // Nur angeklickt: der Klick geht wie bisher an die Karte
                if (!preview) return;
                pointDragged = true;
                const latlng = map.containerPointToLatLng(map.mouseEventToContainerPoint(e));
                const generation = trackGeneration;
                routingChain = routingChain.then(() => moveTrackPoint(pointRef, latlng, generation));
            };

            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        }

        async function addTrackPoint(latlng, generation) {
            if (generation !== trackGeneration) return;
            const point = roundPoint(latlng);

            if (track.points.length) {
                const from = track.points[track.points.length - 1];
                updateStatus("Route wird berechnet …");
                const { segment, warning } = await connectPoints(from, point);
                // Session wurde während des Routings gewechselt
                if (generation !== trackGeneration) return;
                rememberTrack();
                track.segments.push(segment);
                track.points.push(point);
                renderTrack();
                updateStatus(warning);
            } else {
                rememberTrack();
                track.points.push(point);
                renderTrack();
                updateStatus();
            }
            scheduleDraftSave();
        }

        // Punkte und Segmente werden nur ersetzt, nie verändert, flache Kopien genügen daher
        function rememberTrack() {
            trackHistory.push({ points: track.points.slice(), segments: track.segments.slice() });
        }

        function undoTrackChange(generation) {
            if (generation !== trackGeneration || !track.points.length) return;
            const previous = trackHistory.pop();
            if (previous) {
                track.points = previous.points;
                track.segments = previous.segments;
            } else {
                // Nach dem Laden einer Session gibt es keinen Verlauf: letzten Punkt entfernen
                track.points.pop();
                // Mit dem Punkt fällt das Segment weg, das zu ihm führte
                if (track.segments.length > Math.max(track.points.length - 1, 0)) track.segments.pop();
            }
            renderTrack();
            updateStatus();
            scheduleDraftSave();
        }

        function requestUndo() {
            if (!plan) return;
            const generation = trackGeneration;
            routingChain = routingChain.then(() => undoTrackChange(generation));
        }

        btnUndo.addEventListener("click", requestUndo);

        document.addEventListener("keydown", (event) => {
            const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName);
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z" && !inField && !nameDialog.open) {
                event.preventDefault();
                requestUndo();
            }
        });

        selActivity.addEventListener("change", () => {
            if (!plan) return;
            track.activity = selActivity.value;
            scheduleDraftSave();
        });

        // Jeder neue Mausklick beginnt ohne Nachwirkung eines vorherigen Verschiebens
        map.on("mousedown", () => { pointDragged = false; });

        map.on("click", (event) => {
            // Klick nach dem Ablegen eines verschobenen Trackpunkts
            if (pointDragged) {
                pointDragged = false;
                return;
            }
            // Klick schließt nur die offene Auswahlliste von "Öffnen"
            if (!openPanel.hidden) return;
            if (!plan) {
                updateStatus("Zum Zeichnen zuerst mit „Neu“ eine Planung beginnen");
                return;
            }
            const generation = trackGeneration;
            routingChain = routingChain.then(() => addTrackPoint(event.latlng, generation));
        });

        btnNew.addEventListener("click", async () => {
            if (plan && plan.dirty && !confirm("Die aktuelle Planung hat ungespeicherte Änderungen. Trotzdem eine neue Planung beginnen?")) {
                return;
            }
            // Ausstehende Sicherung gehört noch zur bisherigen Session
            if (draftTimer) await saveDraftNow();
            try {
                const view = homebaseView();
                plan = await api("/api/tour-plans", "POST", { draft: { map: view } });
                loadTrack();
                map.setView([view.lat, view.lon], view.zoom);
                updateStatus();
            } catch (e) {
                console.error("Fehler beim Anlegen der Planung:", e);
                updateStatus("Planung konnte nicht angelegt werden");
            }
        });

        // "2026-10-30 10:01:17" -> "30.10.2026 10:01"
        function formatTimestamp(value) {
            const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(value || "");
            return m ? `${m[3]}.${m[2]}.${m[1]} ${m[4]}:${m[5]}` : "";
        }

        function closeOpenPanel() {
            openPanel.hidden = true;
        }

        async function openPlan(planId) {
            closeOpenPanel();
            if (plan && planId === plan.id) return;
            if (plan && plan.dirty && !confirm("Die aktuelle Planung hat ungespeicherte Änderungen. Trotzdem eine andere Planung öffnen?")) {
                return;
            }
            if (draftTimer) await saveDraftNow();
            try {
                plan = await api("/api/tour-plans/" + planId + "/open", "POST");
                loadTrack();
                const view = (plan.draft && plan.draft.map) || homebaseView();
                map.setView([view.lat, view.lon], view.zoom);
                updateStatus();
            } catch (e) {
                console.error("Fehler beim Öffnen der Planung:", e);
                updateStatus("Planung konnte nicht geöffnet werden");
            }
        }

        function renderOpenPanel(plans) {
            openPanel.replaceChildren();
            if (!plans.length) {
                const empty = document.createElement("div");
                empty.className = "planOpenEmpty";
                empty.textContent = "Noch keine Planungen vorhanden";
                openPanel.appendChild(empty);
                return;
            }
            plans.forEach(p => {
                const item = document.createElement("button");
                item.className = "planOpenItem" + (plan && p.id === plan.id ? " current" : "");

                const name = document.createElement("div");
                name.className = "planOpenName";
                name.textContent = p.name;

                const meta = document.createElement("div");
                meta.className = "planOpenMeta" + (p.dirty ? " dirty" : "");
                meta.textContent = "bearbeitet " + formatTimestamp(p.updated_at) + " · " +
                    (p.saved_at ? (p.dirty ? "ungespeicherte Änderungen" : "gespeichert") : "nie gespeichert");

                item.append(name, meta);
                item.addEventListener("click", () => openPlan(p.id));
                openPanel.appendChild(item);
            });
        }

        btnOpen.addEventListener("click", async (event) => {
            event.stopPropagation();
            if (!openPanel.hidden) {
                closeOpenPanel();
                return;
            }
            try {
                const response = await fetch("/api/tour-plans");
                const data = await response.json();
                if (!response.ok || data.status !== "ok") {
                    throw new Error(data.message || data.error || ("HTTP " + response.status));
                }
                renderOpenPanel(data.plans);
                openPanel.hidden = false;
            } catch (e) {
                console.error("Fehler beim Laden der Planungen:", e);
                updateStatus("Planungen konnten nicht geladen werden");
            }
        });

        document.addEventListener("click", (event) => {
            if (!openPanel.hidden && !openPanel.contains(event.target)) closeOpenPanel();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeOpenPanel();
        });

        // Liefert den eingegebenen Namen oder null bei Abbruch
        function askTrackName() {
            return new Promise(resolve => {
                nameInput.value = "";
                nameDialog.returnValue = "";
                nameDialog.addEventListener("close", () => {
                    resolve(nameDialog.returnValue === "ok" ? nameInput.value.trim() : null);
                }, { once: true });
                nameDialog.showModal();
                nameInput.focus();
            });
        }

        document.getElementById("btnPlanNameCancel").addEventListener("click", () => nameDialog.close("cancel"));

        btnSave.addEventListener("click", async () => {
            if (!plan) return;
            const body = {};
            // Noch nie gespeichert: der Track braucht einen Namen
            if (!plan.saved_at) {
                const name = await askTrackName();
                if (!name) return;
                body.name = name;
            }
            clearTimeout(draftTimer);
            draftTimer = null;
            body.draft = currentDraft();
            try {
                plan = await api("/api/tour-plans/" + plan.id + "/save", "POST", body);
                updateStatus();
            } catch (e) {
                console.error("Fehler beim Speichern der Planung:", e);
                updateStatus("Speichern fehlgeschlagen");
            }
        });

        btnDelete.addEventListener("click", async () => {
            if (!plan) return;
            if (!confirm("Planung „" + plan.name + "“ endgültig löschen?")) return;
            // Ausstehende Sicherung verwerfen, sie gehört zur gelöschten Session
            clearTimeout(draftTimer);
            draftTimer = null;
            try {
                // Danach geht es mit der zuletzt bearbeiteten verbliebenen Session weiter
                plan = await api("/api/tour-plans/" + plan.id, "DELETE");
                loadTrack();
                if (plan) {
                    const view = (plan.draft && plan.draft.map) || homebaseView();
                    map.setView([view.lat, view.lon], view.zoom);
                }
                updateStatus();
            } catch (e) {
                console.error("Fehler beim Löschen der Planung:", e);
                updateStatus("Löschen fehlgeschlagen");
            }
        });

        // Export: erst ausstehende Routings und die Sicherung abwarten, damit die Datei
        // dem angezeigten Track entspricht; der Browser legt sie im Download-Verzeichnis ab
        btnExport.addEventListener("click", async () => {
            if (!plan || !track.points.length) return;
            const generation = trackGeneration;
            await routingChain;
            if (generation !== trackGeneration) return;
            if (draftTimer) await saveDraftNow();
            const link = document.createElement("a");
            link.href = "/api/tour-plans/" + plan.id + "/gpx";
            link.download = "";
            document.body.appendChild(link);
            link.click();
            link.remove();
        });

        // Beim Verlassen der Seite eine noch ausstehende Sicherung nachholen
        window.addEventListener("beforeunload", () => {
            if (!plan || !draftTimer) return;
            fetch("/api/tour-plans/" + plan.id + "/draft", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ draft: currentDraft() }),
                keepalive: true
            });
        });

        // Zuletzt bearbeitete Session fortsetzen, sonst Kartenausschnitt der Homebase
        try {
            const response = await fetch("/api/tour-plans/current");
            plan = (await response.json()).plan || null;
        } catch (e) {
            console.error("Fehler beim Laden der Planung:", e);
        }

        loadTrack();
        const view = (plan && plan.draft && plan.draft.map) || homebaseView();
        map.setView([view.lat, view.lon], view.zoom);
        map.on("moveend", scheduleDraftSave);
        updateStatus();
    };
</script>

</body>
</html>
